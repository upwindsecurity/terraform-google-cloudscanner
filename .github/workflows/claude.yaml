name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  interactive:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    uses: upwindsecurity/infra-github-actions/.github/workflows/claude-interactive.yaml@main
    secrets: inherit

  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    if: github.event_name == 'pull_request'
    uses: upwindsecurity/infra-github-actions/.github/workflows/claude-review.yaml@main
    secrets: inherit
